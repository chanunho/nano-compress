[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocompress"
version = "3.0.0"
description = "Local, no-upload video compressor that produces small, playable MP4s."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "chanunho" }]
keywords = ["video", "compression", "ffmpeg", "hevc", "h264", "mp4", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
nanocompress = "compressor:main"

[project.urls]
Repository = "https://github.com/chanunho/nano-compress"
Issues = "https://github.com/chanunho/nano-compress/issues"

[tool.setuptools]
py-modules = ["compressor"]
packages = ["nanocompress"]
